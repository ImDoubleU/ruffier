[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "ruffier-test"
version = "1.0.0"
description = "Desktop application for the Ruffier functional test"
readme = "README.md"
requires-python = ">=3.10"
license = "LicenseRef-Portfolio-Review-Only"
license-files = ["LICENSE"]
authors = [{ name = "Dmitry Oleynik" }]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Win32 (MS Windows)",
    "Intended Audience :: Education",
    "Programming Language :: Python :: 3",
    "Topic :: Education",
]

[project.scripts]
ruffier-test = "ruffier.app:main"

[tool.setuptools.packages.find]
include = ["ruffier*"]
